name: Backend CI

on:
  push:
    branches: [main]
    paths: ['hyperlocal/**', '.github/workflows/backend.yml']
  pull_request:
    branches: [main]
    paths: ['hyperlocal/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hyperlocal      # all run: steps execute here

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21              # match your pom.xml
          cache: maven

      - name: Build and test
        run: ./mvnw -B clean verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: hyperlocal-jar
          path: hyperlocal/target/*.jar
